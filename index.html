    <script>
        // --- Internationalization (i18n) Support ---
        const bcpMap = { EN: 'en-US', JP: 'ja-JP', KO: 'ko-KR', ZH: 'zh-CN' };
        window.bcpMap = bcpMap;

        function getAppLanguage() {
            let l = (localStorage.getItem('language') || localStorage.getItem('selectedLanguage') || 'EN').toUpperCase();
            if (l === 'JA') l = 'JP';
            return ['EN', 'JP', 'KO', 'ZH'].includes(l) ? l : 'EN';
        }

        function t(key, params = {}) {
            const lang = getAppLanguage();
            const dict = window['LANG_' + lang + '_TERMINAL'] || window['LANG_EN_TERMINAL'] || {};
            let str = dict[key] || key;
            Object.keys(params).forEach(p => {
                str = str.replace(new RegExp('\\{' + p + '\\}', 'g'), params[p]);
            });
            return str;
        }
        window.t = t;
        window.getAppLanguage = getAppLanguage;

        function applyLanguage(langCode) {
            if (langCode) localStorage.setItem('language', langCode);
            const lang = getAppLanguage();
            const bcpMap = { EN: 'en-US', JP: 'ja-JP', KO: 'ko-KR', ZH: 'zh-CN' };
            document.documentElement.lang = bcpMap[lang] || 'en-US';
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                const k = el.getAttribute('data-lang-key');
                if (k) {
                    if (el.tagName === 'TITLE') {
                        document.title = t(k);
                    } else {
                        el.textContent = t(k);
                    }
                }
            });
            document.querySelectorAll('[data-lang-placeholder]').forEach(el => {
                const k = el.getAttribute('data-lang-placeholder');
                if (k) el.placeholder = t(k);
            });
            document.querySelectorAll('[data-lang-title]').forEach(el => {
                const k = el.getAttribute('data-lang-title');
                if (k) el.title = t(k);
            });
        }

        window.addEventListener('message', (e) => {
            if (e.data && (e.data.type === 'languageUpdate' || e.data.type === 'localeUpdate')) {
                applyLanguage(e.data.languageCode);
            }
        });

        window.addEventListener('storage', (e) => {
            if (e.key === 'language' || e.key === 'selectedLanguage') {
                applyLanguage(e.newValue);
            }
        });

        window.addEventListener('DOMContentLoaded', () => applyLanguage());
    </script>

<body data-app-name="TERMINAL">
    <div id="terminal-output"></div>
    <div class="terminal-input-container">
        <span class="terminal-prompt">-></span>
        <input type="text" id="terminal-input" autofocus autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <span style="text-align: center; font-size: 10px;"><span data-lang-key="PASTE_WARNING">Do not paste unknown commands in Terminal</span></span>

    <script>
        document.body.dataset.appName = "Terminal"; // Ensure this is set for API calls
        
        let arePrivilegedCommandsUnlocked = false;
        let privilegedCommandsTimeout = null;
        let privilegedChallengeState = { question: null, answer: null };
        
        const outputDiv = document.getElementById('terminal-output');
        const inputField = document.getElementById('terminal-input');
        let commandHistory = [];
        let historyIndex = -1;

        function appendOutput(message, type = '') {
            const line = document.createElement('div');
            line.className = `output-line ${type}`;
            line.innerText = message;
            outputDiv.appendChild(line);
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }

        function appendPrompt(command) {
            const line = document.createElement('div');
            line.className = 'output-line output-prompt';
            line.innerText = `-> ${command}`;
            outputDiv.appendChild(line);
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }

        const commands = {
            'help': 'Shows this help message.',
            'clear': 'Clears the terminal output.',
            'get storage <key>': 'Retrieves a value from Polygol localStorage.',
            'set storage <key> <value>': 'Sets a value in Polygol localStorage.',
            'rm storage <key>': 'Removes a key from Polygol localStorage.',
            'ls storage': 'Lists all keys in Polygol localStorage.',
            'clear storage': 'Clears all Polygol localStorage data (requires confirmation in parent).',
            'ls idb': 'Lists all IndexedDB database names.',
            'ls idb <dbName>': 'Lists all Object Stores in a specific database.',
            'get idb <dbName> <storeName> [key]': 'Reads all records or a specific record from an Object Store.',
            'set idb <dbName> <storeName> <key> <jsonData>': 'Writes/updates a record in an Object Store (privileged).',
            'rm idb <dbName> <storeName> <key>': 'Deletes a record from an Object Store by its key (privileged).',
            'clear idb <dbName> <storeName>': 'Clears all records from an Object Store (privileged).',
            'get setting <key>': 'Retrieves a Polygol setting value (from localStorage).',
            'set setting <key> <value>': 'Sets a Polygol setting value.',
            'list settings': 'Lists common Polygol settings.',
            'get brightness': 'Gets the current screen brightness (0-100).',
            'set brightness <value>': 'Sets screen brightness (0-100).',
            'get theme': 'Gets the current theme (light/dark).',
            'set theme <light|dark>': 'Sets the theme.',
            'get animations': 'Gets animation status (true/false).',
            'set animations <on|off>': 'Enables/disables animations.',
            'ls wallpapers': 'Lists recent wallpapers and their types.',
            'switch wallpaper <left|right|index>': 'Switches to next/previous wallpaper or jumps to index.',
            'rm wallpaper <index>': 'Removes a wallpaper by index (requires confirmation in parent).',
            'clear wallpapers': 'Clears all custom wallpapers (requires confirmation in parent).',
            'open app <url>': 'Opens another Polygolapp by URL (e.g., "./appstore/index.html").',
            'show popup <message>': 'Displays a temporary popup message on Polygol.',
            'show notification <message>': 'Displays a persistent notification on Polygol.',
            'minimize': 'Minimizes the current Terminal Polygolapp.',
            'blackout': 'Turns the Polygol screen black.',
            'list apps': 'Lists all installed Polygolapps.',
            'install app <name> <url> <iconUrl>': 'Installs a new Polygolapp (privileged, dangerous. Requires unlock).',
            'delete app <name>': 'Deletes an installed Polygolapp (privileged).',
            'get time': 'Gets the current time from Polygol.',
            'reboot': 'Reloads the Polygol parent page (privileged).',
            'pwa install': 'Prompts Polygol to install as a PWA.',
            'unlock <answer>': 'Solves the challenge to unlock the run command for 10 minutes.',
            'run <javascript_code>': 'Executes JavaScript code in the parent context (HIGHLY PRIVILEGED & DANGEROUS! Requires unlock).'
        };

        async function handleCommand(command) {
            appendPrompt(command);
            const rawParts = command.trim().split(/\s+/);
            if (!rawParts[0]) return; // Handle empty input

            let cmd = rawParts[0];
            let args = rawParts.slice(1);

            // List of commands that can have a second word to form a multi-word command
            const multiWordBases = ['get', 'set', 'rm', 'ls', 'list', 'open', 'show', 'delete', 'switch', 'install', 'pwa', 'clear'];
            
            if (multiWordBases.includes(cmd) && args.length > 0) {
                // Form a potential multi-word command, e.g., "get storage"
                const potentialCmd = `${cmd} ${args[0]}`;
                // Check against a list of valid multi-word commands
                const validMultiWordCommands = [
                    'get storage', 'get setting', 'get brightness', 'get theme', 'get animations', 'get time', 'get idb',
                    'set storage', 'set setting', 'set brightness', 'set theme', 'set animations', 'set idb',
                    'rm storage', 'rm wallpaper', 'rm idb',
                    'ls storage', 'ls wallpapers', 'ls idb',
                    'list settings', 'list apps',
                    'open app', 'show popup', 'show notification',
                    'delete app', 'switch wallpaper', 'install app', 'pwa install',
                    'clear storage', 'clear wallpapers', 'clear idb'
                ];
                
                if (validMultiWordCommands.includes(potentialCmd)) {
                    cmd = potentialCmd;   // The command is now the full "get storage"
                    args = args.slice(1); // The args are what's left
                }
            }

            switch (cmd) {
                case 'help':
                    appendOutput('Available commands:', 'output-info');
                    for (const key in commands) {
                        appendOutput(`  ${key}: ${commands[key]}`);
                    }
                    break;
                case 'clear':
                    if (args.length === 0) {
                        // No arguments, just clear the terminal output
                        outputDiv.innerHTML = '';
                    } else if (args[0] === 'storage') {
                        // Parent will handle confirmation
                        Polygol._call('clearLocalStorage');
                    } else if (args[0] === 'wallpapers') {
                        // Parent will handle confirmation
                        Polygol._call('clearAllWallpapers');
                    } else {
                        appendOutput('Usage: clear [storage|wallpapers]', 'output-error');
                        Polygol.showPopup(t('CLEAR_ERROR'));
                    }
                    break;
                case 'clear idb':
                    if (args.length === 2) {
                        Polygol.clearIDBStore(args[0], args[1]);
                    } else {
                        appendOutput('Usage: clear idb <dbName> <storeName>', 'output-error');
                    }
                    break;
                    
                // --- Multi-word commands ---
                case 'get storage':
                case 'get setting':
                    if (args.length > 0) {
                        Polygol._call('getLocalStorageItem', [args[0]]);
                    } else {
                        appendOutput(`Usage: ${cmd} <key>`, 'output-error');
                    }
                    break;
                case 'get idb':
                    if (args.length === 2) { // get idb dbName storeName
                        Polygol.getIDBRecord(args[0], args[1], null); // null key gets all
                    } else if (args.length === 3) { // get idb dbName storeName key
                        // Keys can be numbers, so we try to parse them
                        const key = isNaN(parseInt(args[2])) ? args[2] : parseInt(args[2]);
                        Polygol.getIDBRecord(args[0], args[1], key);
                    } else {
                        appendOutput('Usage: get idb <dbName> <storeName> [key]', 'output-error');
                    }
                    break;
                case 'set idb':
                    // Robust JSON parsing
                    if (args.length >= 3) {
                        const dbName = args[0];
                        const storeName = args[1];
                        const key = args[2];
                        
                        // Find where the JSON data starts in the original command
                        const keyIndex = command.indexOf(key);
                        const jsonStartIndex = command.indexOf('{', keyIndex + key.length);
    
                        if (jsonStartIndex > -1) {
                            const jsonData = command.substring(jsonStartIndex);
                            const finalKey = isNaN(Number(key)) ? key : Number(key);
                            Polygol.setIDBRecord(dbName, storeName, finalKey, jsonData);
                        } else {
                            appendOutput('Invalid command format. JSON data must start with {', 'output-error');
                        }
                    } else {
                        appendOutput('Usage: set idb <dbName> <storeName> <key> <jsonData>', 'output-error');
                    }
                    break;
                case 'rm idb':
                    if (args.length === 3) {
                        const key = isNaN(parseInt(args[2])) ? args[2] : parseInt(args[2]);
                        Polygol.removeIDBRecord(args[0], args[1], key);
                    } else {
                        appendOutput('Usage: rm idb <dbName> <storeName> <key>', 'output-error');
                    }
                    break;
                case 'ls storage':
                    Polygol._call('listLocalStorageKeys');
                    break;
                case 'ls idb':
                     if (args.length === 0) {
                        Polygol.listIDBDatabases();
                    } else if (args.length === 1) {
                        Polygol.listIDBStores(args[0]);
                    } else {
                        appendOutput('Usage: ls idb [dbName]', 'output-error');
                    }
                case 'get brightness':
                    Polygol._call('getLocalStorageItem', ['page_brightness']);
                    break;
                case 'get theme':
                    Polygol._call('getLocalStorageItem', ['theme']);
                    break;
                case 'get animations':
                    Polygol._call('getLocalStorageItem', ['animationsEnabled']);
                    break;
                case 'get time':
                    Polygol._call('getCurrentTimeParent');
                    break;

                case 'set storage':
                case 'set setting':
                    if (args.length >= 2) {
                        const key = args[0];
                        const value = args.slice(1).join(' ');
                        Polygol._call('setLocalStorageItem', [key, value]);
                    } else {
                        appendOutput(`Usage: ${cmd} <key> <value>`, 'output-error');
                    }
                    break;
                case 'set brightness':
                    const brightnessValue = parseInt(args[0]);
                    if (!isNaN(brightnessValue) && brightnessValue >= 0 && brightnessValue <= 100) {
                        Polygol._call('setLocalStorageItem', ['page_brightness', brightnessValue.toString()]);
                    } else {
                        appendOutput('Invalid brightness value. Must be between 0 and 100.', 'output-error');
                    }
                    break;
                case 'set theme':
                    if (args[0] === 'light' || args[0] === 'dark') {
                        Polygol._call('setLocalStorageItem', ['theme', args[0]]);
                    } else {
                        appendOutput('Usage: set theme <light|dark>', 'output-error');
                    }
                    break;
                case 'set animations':
                    if (args[0] === 'on' || args[0] === 'off') {
                        const enabled = args[0] === 'on';
                        Polygol._call('setLocalStorageItem', ['animationsEnabled', enabled.toString()]);
                    } else {
                        appendOutput('Usage: set animations <on|off>', 'output-error');
                    }
                    break;

                case 'rm storage':
                    if (args.length > 0) {
                        Polygol._call('removeLocalStorageItem', [args[0]]);
                    } else {
                        appendOutput('Usage: rm storage <key>', 'output-error');
                    }
                    break;
                case 'rm wallpaper':
                    const rmIndex = parseInt(args[0]);
                    if (!isNaN(rmIndex)) {
                        Polygol._call('removeWallpaperAtIndex', [rmIndex]);
                    } else {
                        appendOutput('Invalid wallpaper index. Must be a number.', 'output-error');
                    }
                    break;

                case 'ls storage':
                    Polygol._call('listLocalStorageKeys');
                    break;
                case 'ls wallpapers':
                    Polygol._call('listRecentWallpapers');
                    break;

                case 'list apps':
                    Polygol.requestInstalledApps();
                    break;
                case 'list settings':
                    Polygol._call('listCommonSettings');
                    break;

                case 'open app':
                    if (args.length > 0) {
                        Polygol.openApp(args[0]);
                        appendOutput(`Attempting to open app: ${args[0]}`, 'output-info');
                    } else {
                        appendOutput('Usage: open app <url>', 'output-error');
                    }
                    break;

                case 'show popup':
                case 'show notification':
                    if (args.length > 0) {
                        const message = args.join(' ');
                        const isPopup = cmd.includes('popup');
                        if (isPopup) {
                            Polygol.showPopup(message);
                            appendOutput(`Popup sent: '${message}'`, 'output-info');
                        } else {
                            Polygol.showNotification(message, { icon: 'info' });
                            appendOutput(`Notification sent: '${message}'`, 'output-info');
                        }
                    } else {
                        appendOutput(`Usage: ${cmd} <message>`, 'output-error');
                    }
                    break;
                
                case 'minimize':
                    Polygol.minimize();
                    break;
                case 'blackout':
                    Polygol.blackout();
                    break;
                case 'reboot':
                    Polygol._call('rebootPolygol');
                    break;
                
                case 'pwa install':
                    Polygol._call('promptPWAInstall');
                    appendOutput('PWA installation prompt sent (if available).', 'output-info');
                    break;

                case 'switch wallpaper':
                     if (args.length > 0) {
                        Polygol._call('switchWallpaperParent', [args[0]]);
                    } else {
                        appendOutput('Usage: switch wallpaper <left|right|index>', 'output-error');
                    }
                    break;

                case 'delete app':
                    if (args.length > 0) {
                        const appName = args.join(' ');
                        Polygol.deleteApp(appName); // Parent handles confirmation
                        appendOutput(`Deletion request sent for '${appName}'.`, 'output-info');
                    } else {
                        appendOutput('Usage: delete app <name>', 'output-error');
                    }
                    break;
                    
                // --- Privileged Commands ---
                case 'install app':
                case 'run':
                case 'set idb':
                case 'rm idb':
                case 'clear idb':
                    const isInstall = cmd === 'install app';
                    const commandName = isInstall ? 'install' : 'run';

                    if (!arePrivilegedCommandsUnlocked) {
                        if (!privilegedChallengeState.question) {
                            const num1 = Math.floor(Math.random() * 20) + 1;
                            const num2 = Math.floor(Math.random() * 20) + 1;
                            privilegedChallengeState.question = `What is ${num1} + ${num2}?`;
                            privilegedChallengeState.answer = (num1 + num2).toString();
                        }
                        appendOutput(`WARNING: The "${commandName}" command is privileged and can be dangerous.`, 'output-error');
                        appendOutput('To prevent accidental use, please solve the following challenge:', 'output-info');
                        appendOutput(`CHALLENGE: ${privilegedChallengeState.question}`, 'output-info');
                        appendOutput('Unlock by typing: unlock <your_answer>', 'output-info');
                        break;
                    }
                    
                    if (isInstall) {
                        if (args.length >= 3) {
                            const iconUrl = args[args.length - 1];
                            const url = args[args.length - 2];
                            const name = args.slice(0, args.length - 2).join(' ');
                            
                            const appData = { name, url, iconUrl, filesToCache: [url, iconUrl] };
                            Polygol.installApp(appData);
                            appendOutput(`Installation request sent for '${name}'.`, 'output-info');
                        } else {
                            appendOutput('Usage: install app <name> <url> <iconUrl>', 'output-error');
                        }
                    } else if (cmd === 'run') {
                        if (args.length > 0) {
                            const code = args.join(' ');
                            Polygol._call('executeParentJS', [code]);
                            appendOutput(`Executing JS in parent: '${code}'`, 'output-info');
                        } else {
                            appendOutput('Usage: run <javascript_code>', 'output-error');
                        }
                    } else if (cmd === 'set idb') {
                        if (args.length >= 3) {
                            const dbName = args[0];
                            const storeName = args[1];
                            const key = args[2];
                            const keyIndex = command.indexOf(key);
                            const jsonStartIndex = command.indexOf('{', keyIndex + key.length);
    
                            if (jsonStartIndex > -1) {
                                const jsonData = command.substring(jsonStartIndex);
                                const finalKey = isNaN(Number(key)) ? key : Number(key);
                                Polygol.setIDBRecord(dbName, storeName, finalKey, jsonData);
                            } else {
                                appendOutput('Invalid command format. JSON data must start with {', 'output-error');
                            }
                        } else {
                            appendOutput('Usage: set idb <dbName> <storeName> <key> <jsonData>', 'output-error');
                        }
                    } else if (cmd === 'rm idb') {
                        if (args.length === 3) {
                            const key = isNaN(Number(args[2])) ? args[2] : Number(args[2]);
                            Polygol.removeIDBRecord(args[0], args[1], key);
                        } else {
                            appendOutput('Usage: rm idb <dbName> <storeName> <key>', 'output-error');
                        }
                    } else if (cmd === 'clear idb') {
                        if (args.length === 2) {
                            Polygol.clearIDBStore(args[0], args[1]);
                        } else {
                            appendOutput('Usage: clear idb <dbName> <storeName>', 'output-error');
                        }
                    }
                    break;
                
                case 'unlock':
                    if (args[0] !== undefined) {
                        if (!privilegedChallengeState.answer) {
                            appendOutput('No active challenge. Try a privileged command first.', 'output-error');
                            break;
                        }
                        if (args[0].toString() === privilegedChallengeState.answer) {
                            arePrivilegedCommandsUnlocked = true;
                            appendOutput('Privileged commands unlocked for 10 minutes.', 'output-success');
                            if (privilegedCommandsTimeout) clearTimeout(privilegedCommandsTimeout);
                            privilegedCommandsTimeout = setTimeout(() => {
                                arePrivilegedCommandsUnlocked = false;
                                appendOutput('Access to privileged commands has expired.', 'output-info');
                            }, 10 * 60 * 1000);
                            privilegedChallengeState = { question: null, answer: null };
                        } else {
                            appendOutput('Try again. The challenge has been reset.', 'output-error');
                            privilegedChallengeState = { question: null, answer: null };
                        }
                    } else {
                        appendOutput('Usage: unlock <answer>', 'output-error');
                    }
                    break;

                default:
                    appendOutput(`Unknown command: ${rawParts.join(' ')}. Type 'help' for a list.`, 'output-error');
                    break;
            }
        }

        inputField.addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                const command = inputField.value.trim();
                if (command) {
                    handleCommand(command);
                    commandHistory.unshift(command);
                    historyIndex = -1;
                }
                inputField.value = '';
            } else if (event.key === 'ArrowUp') {
                event.preventDefault();
                if (commandHistory.length > 0 && historyIndex < commandHistory.length - 1) {
                    historyIndex++;
                    inputField.value = commandHistory[historyIndex];
                }
            } else if (event.key === 'ArrowDown') {
                event.preventDefault();
                if (historyIndex > 0) {
                    historyIndex--;
                    inputField.value = commandHistory[historyIndex];
                } else {
                    historyIndex = -1;
                    inputField.value = '';
                }
            }
        });

        // Focus the input field on load
        inputField.focus();

        // Initial welcome message
        appendOutput(t('WELCOME_TITLE'), 'output-info');
        appendOutput(t('WELCOME_L1'), 'output-info');
        appendOutput(t('WELCOME_L2'), 'output-info');
        appendOutput(t('WELCOME_L3'), 'output-info');
        appendOutput(t('WELCOME_L4'), 'output-info');

        // Handle messages from the parent (Polygol)
        window.addEventListener('message', (event) => {
            if (event.origin !== window.location.origin) return;

            const data = event.data;

            if (data && data.type) {
                switch (data.type) {
                    case 'localStorageItemValue':
                        appendOutput(`Storage key '${data.key}': ${JSON.stringify(data.value)}`, 'output-info');
                        break;
                    case 'localStorageKeysList':
                        if (data.keys && data.keys.length > 0) {
                            appendOutput('Polygol LocalStorage Keys:', 'output-info');
                            data.keys.forEach(key => appendOutput(`- ${key}`));
                        } else {
                            appendOutput('No Polygol LocalStorage keys found.', 'output-info');
                        }
                        break;
                    case 'idbDatabasesList':
                        if (data.dbs && data.dbs.length > 0) {
                            appendOutput('IndexedDB Databases:', 'output-info');
                            data.dbs.forEach(name => appendOutput(`- ${name}`));
                        } else {
                            appendOutput('No IndexedDB databases found.', 'output-info');
                        }
                        break;
                    case 'idbStoresList':
                        if (data.stores && data.stores.length > 0) {
                            appendOutput(`Object Stores in '${data.dbName}':`, 'output-info');
                            data.stores.forEach(name => appendOutput(`- ${name}`));
                        } else {
                            appendOutput(`No Object Stores found in '${data.dbName}'.`, 'output-info');
                        }
                        break;
                    case 'idbRecordValue':
                        const value = data.value;
                        if (value === undefined) {
                            appendOutput(`No record found for key '${data.key}' in '${data.dbName}/${data.storeName}'.`, 'output-info');
                        } else if (Array.isArray(value)) {
                             appendOutput(`All records from '${data.dbName}/${data.storeName}':`, 'output-info');
                             if (value.length === 0) {
                                 appendOutput('(Store is empty)');
                             } else {
                                value.forEach(item => appendOutput(JSON.stringify(item, null, 2)));
                             }
                        } else {
                             appendOutput(`Record from '${data.dbName}/${data.storeName}' for key '${data.key}':`, 'output-info');
                             appendOutput(JSON.stringify(value, null, 2));
                        }
                        break;
                    case 'commonSettingsList':
                        if (data.settings && Object.keys(data.settings).length > 0) {
                            appendOutput('Common Polygol Settings:', 'output-info');
                            for (const setting in data.settings) {
                                appendOutput(`- ${setting}: ${JSON.stringify(data.settings[setting])}`);
                            }
                        } else {
                            appendOutput('No common settings found.', 'output-info');
                        }
                        break;
                    case 'installed-apps-list':
                        if (data.apps && data.apps.length > 0) {
                            appendOutput('Installed Polygolapps:', 'output-info');
                            data.apps.forEach(app => appendOutput(`- ${app}`));
                        } else {
                            appendOutput('No Polygolapps found.', 'output-info');
                        }
                        break;
                    case 'recentWallpapersList':
                        if (data.wallpapers && data.wallpapers.length > 0) {
                            appendOutput('Recent Wallpapers:', 'output-info');
                            data.wallpapers.forEach((wp, index) => {
                                const typeInfo = wp.isSlideshow ? 'Slideshow' : `Type: ${wp.type}`;
                                // Add the wallpaper's ID to the output if it exists
                                const idInfo = wp.id ? ` | ID: ${wp.id}` : '';
                                appendOutput(`- [${index}] ${typeInfo}${idInfo}`);
                            });
                        } else {
                            appendOutput('No recent wallpapers found.', 'output-info');
                        }
                        break;
                    case 'currentTimeValue':
                        appendOutput(`Current Time (Parent): ${data.time}`, 'output-info');
                        break;
                    case 'commandOutput':
                        appendOutput(`Parent Eval Result: ${data.result}`, 'output-success');
                        break;
                    case 'commandError':
                        appendOutput(`Parent Eval Error: ${data.error}`, 'output-error');
                        break;
                    case 'parentActionSuccess':
                        if (data.message) {
                            appendOutput(`Polygol: ${data.message}`, 'output-success');
                        } else {
                            appendOutput('Polygol action successful.', 'output-success');
                        }
                        break;
                    case 'parentActionInfo':
                        if (data.message) {
                            appendOutput(`Polygol: ${data.message}`, 'output-info');
                        } else {
                            appendOutput('Polygol info received.', 'output-info');
                        }
                        break;
                    case 'parentActionError':
                        if (data.message) {
                            appendOutput(`Polygol Error: ${data.message}`, 'output-error');
                        } else {
                            appendOutput('Polygol action failed.', 'output-error');
                        }
                        break;
                    case 'themeUpdate': // Handle theme changes from parent
                        document.body.classList.toggle('light-theme', data.theme === 'light');
                        break;
                    case 'animationsUpdate': // Handle animations changes from parent
                        document.body.classList.toggle('reduce-animations', !data.enabled);
                        break;
                }
            }
        });
    </script>
</body>
</html>
